name: CI/CD

# `main` is listed alongside `master` so a future default-branch rename does not
# silently stop deployments.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # An empty base builds a bundle that requests /api on the Pages origin, where nothing
      # answers. That failure only shows up in the browser, so catch it here instead.
      - name: Check API base is configured
        if: github.event_name != 'pull_request'
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::Repository variable VITE_API_BASE is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch must match the project's production branch, otherwise Pages files the
          # upload as a preview deployment and the live site never changes.
          command: pages deploy dist --project-name=java-quiz --branch=master
