name: CI/CD

# `main` is listed alongside `master` so a future default-branch rename does not
# silently stop deployments.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # A gate, not the artefact: the bundle that ships is the one Render builds, with
      # VITE_API_BASE from render.yaml. This only proves the commit compiles before the
      # deploy hook fires.
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Render rejects overlapping deploys; queue them instead of racing.
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set (Render dashboard > Settings > Deploy Hook)."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy requested. Build logs: https://dashboard.render.com"
